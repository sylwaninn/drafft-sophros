# sophros CI: every change is checked; `staging` ships to staging, `main` to production.
#
#   pull request     → PR title, quality (types, lint, format, tests, build), bundles for both
#                      environments, security (dependencies, secrets, workflows)
#   push to staging  → the same checks, then deploy sophros-staging and smoke-test it behind Access
#   push to main     → the same checks, then deploy sophros-production (once PRODUCTION_ENABLED=true)
#
# Flow: feature branch → PR into staging → PR from staging into main.
# Wrangler needs the secret CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID. The Workers'
# own secrets (SUPABASE_SECRET_KEY, STREAM_API_*) live in Cloudflare (`wrangler secret put`).
# Third-party actions are pinned to a commit; Dependabot bumps them.
name: ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A deploy in progress is never cancelled halfway; superseded PR runs are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  pr-title:
    name: PR title (type(scope) description)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional, lowercase, no final period
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore)(\([a-z0-9-]+\))?: [a-z].*[^.]$'; then
            echo "::error::PR title \"$TITLE\" isn't type(scope): lowercase description without a final period."
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it under 72."
            exit 1
          fi

  quality:
    name: quality (types, lint, format, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint (correctness, React hooks, accessibility)
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  bundle:
    name: bundle (${{ matrix.environment }}, dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and bundle the Worker for ${{ matrix.environment }}, without deploying
        env:
          CLOUDFLARE_ENV: ${{ matrix.environment }}
        run: |
          pnpm exec react-router build
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
          du -sh "$RUNNER_TEMP/worker"

  security:
    name: security (dependencies, secrets, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No install here: the audit reads the lockfile, so no pnpm store to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Known vulnerabilities in production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
      - name: Secrets (whole history)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --no-banner --config .gitleaks.toml --redact .
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Workflows security (zizmor)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 --min-severity medium --persona regular .github/workflows
      - name: Shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning scripts/*.sh scripts/ci/*.sh .agents/git-hooks/*

  deploy-staging:
    name: deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [quality, bundle, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://sophros-staging.getdrafft.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_ENV: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          pnpm exec react-router build
          pnpm exec wrangler deploy --message "ci ${COMMIT::7}"
      - name: Smoke test (answers, and only behind Access)
        run: scripts/ci/smoke.sh https://sophros-staging.getdrafft.com drafft-sophros.cloudflareaccess.com

  deploy-production:
    name: deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    needs: [quality, bundle, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sophros.getdrafft.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          pnpm exec react-router build
          pnpm exec wrangler deploy --message "ci ${COMMIT::7}"
      - name: Smoke test (answers, and only behind Access)
        run: scripts/ci/smoke.sh https://sophros.getdrafft.com drafft-sophros.cloudflareaccess.com
